name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: The tag is the helper's version
        run: |
          V=$(python -c "import fwchelper; print(fwchelper.__version__)")
          T=${GITHUB_REF_NAME#v}
          test "$V" = "$T" || { echo "tag v$T, but fwchelper is $V"; exit 1; }
          grep -q "^## Version: $V$" addon/ForeverWowCraftScanner/ForeverWowCraftScanner.toc || { echo "the .toc is not at $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Tests
        run: |
          pip install lupa pillow
          for t in tests/test_*.py; do echo "== $t"; python "$t" || exit 1; done
          python tests/lua_check.py addon/ForeverWowCraftScanner/*.lua
      - name: The zips
        run: |
          mkdir -p dist
          (cd addon && zip -qr "../dist/ForeverWowCraftScanner-$VERSION.zip" ForeverWowCraftScanner)
          git archive --format=zip --prefix=ForeverWowCraft-Helper/ -o "dist/ForeverWowCraft-Helper-$VERSION.zip" HEAD
          ls -l dist
      # A draft until the installer is on it: published here, the release was the newest for the
      # minutes the Windows build took, with no .msi to download at releases/latest (the site's
      # link, and the helpers' own update check) and players met an error (8 Nov 2026)
      - name: The GitHub release, a draft until the installer is on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --draft --title "ForeverWowCraft Helper $VERSION" --generate-notes
      - name: CurseForge
        env:
          TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID }}
          GAME_VERSION: ${{ vars.CURSEFORGE_GAME_VERSION }}
          RELEASE_TYPE: ${{ vars.CURSEFORGE_RELEASE_TYPE || 'release' }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$PROJECT" ] || [ -z "$GAME_VERSION" ]; then
            echo "CurseForge: skipped. CURSEFORGE_TOKEN (a secret), CURSEFORGE_PROJECT_ID and CURSEFORGE_GAME_VERSION (variables) are not all set."
            exit 0
          fi
          ID=$(curl -sf -H "x-api-token: $TOKEN" https://wow.curseforge.com/api/game/versions | python -c "import json, os, sys; v = [x['id'] for x in json.load(sys.stdin) if x['name'] == os.environ['GAME_VERSION']]; print(v[0] if v else '')")
          test -n "$ID" || { echo "CurseForge lists no game version named $GAME_VERSION"; exit 1; }
          case "$RELEASE_TYPE" in alpha|beta|release) ;; *) echo "CURSEFORGE_RELEASE_TYPE must be alpha, beta or release, not $RELEASE_TYPE"; exit 1;; esac
          META='{"changelog":"https://github.com/'"$GITHUB_REPOSITORY"'/releases/tag/'"$GITHUB_REF_NAME"'","changelogType":"markdown","gameVersions":['"$ID"'],"releaseType":"'"$RELEASE_TYPE"'"}'
          curl -sf -H "x-api-token: $TOKEN" -F "metadata=$META" -F "file=@dist/ForeverWowCraftScanner-$VERSION.zip" "https://wow.curseforge.com/api/projects/$PROJECT/upload-files"
          echo "CurseForge: uploaded ForeverWowCraftScanner-$VERSION.zip to project $PROJECT for game version $GAME_VERSION ($ID) as $RELEASE_TYPE"

  installer:
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "The installer: Python and WiX fetched and checked, the .msi built"
        run: python installer/build.py --out dist
      - name: On the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          Copy-Item $msi dist/ForeverWowCraft-Helper.msi
          gh release upload "$env:GITHUB_REF_NAME" $msi dist/ForeverWowCraft-Helper.msi
      - name: "Published: the newest release, with its installer"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest

  # The Mac application, on the project's own Mac: a self-hosted runner, "imac", which only a tag
  # of the project's reaches (this workflow runs on tags alone, and the repository asks approval
  # for every outside contributor's workflow). The repository variable MAC_RUNNER switched away
  # from "on" skips the job while the Mac is off. The upload is the API itself: the Mac has no gh.
  # After the installer: the release is published by then (a draft has no tag to be found by).
  mac:
    needs: installer
    if: vars.MAC_RUNNER == 'on'
    runs-on: [self-hosted, macOS, imac]
    permissions:
      contents: write
    steps:
      - name: "Nothing of the Mac's in the log: the home folder and the account name are masked (the log is public)"
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$(whoami)"
      - uses: actions/checkout@v4
      - name: "The application and its disk image: Python fetched and checked, PyObjC into it (installer/build_mac.py)"
        run: |
          echo "/Library/Frameworks/Python.framework/Versions/3.14/bin" >> "$GITHUB_PATH"
          /Library/Frameworks/Python.framework/Versions/3.14/bin/python3 installer/build_mac.py --out dist --cache "$HOME/Library/Caches/ForeverWowCraft-build"
      - name: On the release, by its version and by its fixed name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls dist/*.dmg)
          cp "$dmg" dist/ForeverWowCraft-Helper.dmg
          id=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" | python3 -c "import json, sys; print(json.load(sys.stdin)['id'])")
          for f in "$dmg" dist/ForeverWowCraft-Helper.dmg; do
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f"               "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename "$f")" > /dev/null
            echo "uploaded $(basename "$f")"
          done
